name: Build CIViC Frontend

on:
  workflow_call:
    inputs:
      branch:
        required: true
        type: string

jobs:
  build_frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.branch }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
        with:
          working-directory: ./server
          bundler-cache: true
          ruby-version: '4.0.1'

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - run: npm install -g yarn
        working-directory: ./client

      - run: yarn install --frozen-lockfile
        working-directory: ./client

      - run: rm -f public/*.js
        working-directory: ./server

      - run: yarn build
        working-directory: ./client

      - run: bundle exec rails assets:precompile
        working-directory: ./server
        env:
          RAILS_ENV: production
          SECRET_KEY_BASE_DUMMY: 1

      - run: bundle exec rake rails_schema:generate
        working-directory: ./server
        env:
          SECRET_KEY_BASE_DUMMY: 1

      - if: ${{ inputs.branch == 'staging' }}
        run: mv -f lib/assets/favicon.staging.ico public/favicon.ico
        working-directory: ./server

      - name: Commit and push build
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9.1.4
        with:
          add: server/public/*
          push: origin ${{ inputs.branch }}
          message: Automated frontend build
