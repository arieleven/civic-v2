name: Test Example Scripts

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main, staging]

jobs:
  run-scripts:
    runs-on: 'ubuntu-latest'

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Ruby
      uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1
      with:
        ruby-version: '4.0.1'

    - name: Install Ruby dependencies
      run: gem install httparty

    - name: Run Ruby script
      run: ruby examples/fetch_variant_links.rb

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: '3.13'

    - name: Install Python dependencies
      run: pip install requests

    - name: Run Python script
      run: python examples/fetch_all_variants.py

    - name: Set up R
      uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      with:
        r-version: '4.4'

    - name: Install system dependencies for R packages
      run: |
        sudo apt-get update
        sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

    - name: Run R script
      run: Rscript examples/fetch_acmg_code.R
